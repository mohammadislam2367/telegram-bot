name: Repair Telegram Webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: sbbxlwlgeyshrhmemovq
        run: |
          set -euo pipefail
          SECRETS_JSON=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_ID/secrets")
          SETUP_SECRET=$(printf '%s' "$SECRETS_JSON" | jq -r '.[] | select(.name=="SCHEDULER_SECRET") | .value // empty')
          if [ -z "$SETUP_SECRET" ]; then
            echo "::error::SCHEDULER_SECRET was not returned by the Supabase API"
            exit 1
          fi
          echo "::add-mask::$SETUP_SECRET"
          RESPONSE=$(curl -sS -X POST -H "x-setup-secret: $SETUP_SECRET" "https://sbbxlwlgeyshrhmemovq.supabase.co/functions/v1/health?repair=1")
          echo "$RESPONSE" | jq .
          test "$(echo "$RESPONSE" | jq -r '.ok')" = "true"
