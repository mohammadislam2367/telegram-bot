name: Repair Telegram Webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: sbbxlwlgeyshrhmemovq
        run: |
          set -euo pipefail
          SECRETS_JSON=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_ID/secrets")
          BOT_TOKEN=$(printf '%s' "$SECRETS_JSON" | jq -r '.[] | select(.name=="TELEGRAM_BOT_TOKEN") | .value // empty')
          WEBHOOK_SECRET=$(printf '%s' "$SECRETS_JSON" | jq -r '.[] | select(.name=="TELEGRAM_WEBHOOK_SECRET") | .value // empty')
          if [ -z "$BOT_TOKEN" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error::Telegram credentials were not returned by the Supabase API"
            exit 1
          fi
          echo "::add-mask::$BOT_TOKEN"
          echo "::add-mask::$WEBHOOK_SECRET"
          PAYLOAD=$(jq -n \
            --arg url "https://sbbxlwlgeyshrhmemovq.supabase.co/functions/v1/telegram-bot" \
            --arg secret "$WEBHOOK_SECRET" \
            '{url: $url, secret_token: $secret, allowed_updates: ["message", "edited_message", "callback_query", "chat_member", "my_chat_member"], max_connections: 40}')
          SET_RESULT=$(curl -fsS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "https://api.telegram.org/bot$BOT_TOKEN/setWebhook")
          echo "$SET_RESULT" | jq '{ok, description}'
          INFO=$(curl -fsS "https://api.telegram.org/bot$BOT_TOKEN/getWebhookInfo")
          echo "$INFO" | jq '{ok, url_configured: (.result.url != ""), allowed_updates: .result.allowed_updates, pending_update_count: .result.pending_update_count}'
          test "$(echo "$SET_RESULT" | jq -r '.ok')" = "true"
